base-config:
  supports_rate_limit_monitoring: true
  company: Anthropic
  country: United States
  open_source: false
  supports:
    images: true
    files: true
    tools: true
    temperature: true
    output_schema: true
  properties:
    reasoning_model: false
  costs_per_million_token:
    cache:
      read_discount: 0.1
      write_markup: 1.25
    batch:
      input_discount: 0.5
      output_discount: 0.5
  documentation_url: https://docs.claude.com/en/docs/about-claude/models/overview
  default_parameters:
    temperature: 1

claude-fable-5-models:
  anthropic/claude-fable-5:
    label: Claude Fable 5
    release_date: 2026-06-09
    properties:
      context_window: 1_000_000
      max_tokens: 128_000
      reasoning_model: true
    costs_per_million_token:
      input: 10.0
      output: 50.0
      cache:
        read: 1.0
        write: 12.5
    supports_rate_limit_monitoring: false
    provider_properties:
      supports_auto_thinking: true
      supports_compute_effort: true
      fallback_models:
        - claude-opus-4-8
    default_parameters:
      max_tokens: 128_000
      compute_effort: "max"
    alternative_keys:
      - anthropic/claude-fable-5-high:
          label: Claude Fable 5 (High Effort)
          default_parameters:
            compute_effort: "high"
      - anthropic/claude-fable-5-no-fallback:
          label: Claude Fable 5 (No Fallback)
          provider_properties:
            fallback_models: []
