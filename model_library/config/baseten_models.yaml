    supports:
      images: true
      output_schema: true
    metadata:
      available_for_everyone: true
      ignored_for_cost: false
    provider_properties:
      api_base: https://inference.baseten.co/v1
    default_parameters:
      reasoning_effort: max
      temperature: 1
      top_p: 1
    properties:
      context_window: 1_048_576
      max_tokens: 32_768
      reasoning_model: true
