base-config:
  company: Inception
  country: United States
  documentation_url: https://docs.inceptionlabs.ai/get-started/models
  open_source: false
  supports:
    images: false
    tools: true
    files: false

mercury-models:
  inception/mercury-3:
    metadata:
      available_for_everyone: false
    label: Mercury 3
    release_date: 2026-10-19
    properties:
      reasoning_model: true
      context_window: 1_000_000
      max_tokens: 131_072
    supports:
      output_schema: true
    default_parameters:
      reasoning_effort: "high"
    costs_per_million_token:
      # https://docs.inceptionlabs.ai/get-started/models.md; OpenRouter's Inception-only route also quotes 50% off.
      input: 0.20
      output: 0.70
      current_discount: 50
      cache:
        read: 0.02

  inception/mercury-2.5:
    metadata:
      available_for_everyone: false
    label: Mercury 2.5
    release_date: 2026-09-08
    properties:
      reasoning_model: true
      context_window: 260_000
      max_tokens: 65_536
    supports:
      output_schema: true
    default_parameters:
      reasoning_effort: "high"
    costs_per_million_token:
      input: 0.20
      output: 0.75
      cache:
        read: 0.02
    alternative_keys:
      - openrouter/inception/mercury-2.5:
          metadata:
            available_for_everyone: false
          provider_properties:
            openrouter_provider_only: [inception]
          # https://openrouter.ai/api/v1/models/inception/mercury-2.5/endpoints; native pricing is unchanged.
          costs_per_million_token:
            current_discount: 80

  inception/mercury:
    metadata:
      available_for_everyone: false
    label: Mercury
    release_date: 2025-11-06
    properties:
      reasoning_model: false
      context_window: 128_000
      max_tokens: 16_384 # rounded down
    costs_per_million_token:
      input: 0.25
      output: 1
