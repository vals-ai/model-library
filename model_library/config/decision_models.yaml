# Typed-decision models: one call takes a state and typed questions and returns a typed answer for each (a choice
# with a probability for every option, a probability, or a score). They do not generate text. Served by the
# `decision` provider (providers/delegates/openrouter/decision.py) through OpenRouter's Decisions API with OPENROUTER_API_KEY, or
# OpenAI's with OPENAI_API_KEY (`decision_api: openai`) or Perplexity's with PERPLEXITY_API_KEY (`decision_api: perplexity`). See docs/decision-models.md.
# Prices are USD per million input tokens, output is free. OpenRouter context windows are from its decision-model
# catalog.
base-config:
  open_source: false
  supports:
    images: false
    videos: false
    files: false
    temperature: false
    tools: false
    output_schema: false
  properties:
    # No free-text output, so there is no output budget.
    max_tokens: 0
    reasoning_model: false
  metadata:
    available_as_evaluator: false
  costs_per_million_token:
    output: 0.0

decision-models:
  decision/jev-1.13.0:
    provider_endpoint: typesafe/jev-1.13-20260917  # pinned, dated; never an alias
    label: Jev 1.13.0
    company: TypeSafe
    country: United States
    documentation_url: https://openrouter.ai/typesafe/jev-1.13
    release_date: 2026-09-18
    properties:
      context_window: 262_144
    costs_per_million_token:
      input: 0.042

