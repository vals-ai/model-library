base-config:
  rate_limit:
    supports_live_monitoring: true
    cache_read_counts_toward_limit: false
  company: Meta
  country: United States
  documentation_url: https://docs.llama.com
  open_source: false
  supports:
    temperature: true
    images: true
    files: true
    tools: true
  metadata:
    available_for_everyone: false
    internal_only: true
public-models:
  base-config:
    documentation_url: https://dev.meta.ai/docs/models
    metadata:
      available_for_everyone: true
      internal_only: false

  meta/muse_spark_1_2:

    label: Muse Spark 1.2
    provider_endpoint: muse-spark-1.2
    supports:
      videos: true
    provider_properties:
      use_responses: true
      prompt_cache_key: hash
    release_date: 2026-08-05
    default_parameters:
      reasoning_effort: "xhigh"
      temperature: 1
    properties:
      context_window: 1_048_576
      max_tokens: 131_072
      reasoning_model: true
    costs_per_million_token:
      input: 1.25
      output: 4.25
      cache:
        read: 0.15
  meta/muse_spark_1_3:
    label: Muse Spark 1.3
    provider_endpoint: muse-spark-1.3
    supports:
      videos: true
    provider_properties:
      use_responses: true
      prompt_cache_key: hash
    release_date: 2026-09-02
    default_parameters:
      reasoning_effort: "xhigh"
      temperature: 1
    properties:
      context_window: 1_048_576
      max_tokens: 131_072
      reasoning_model: true
    costs_per_million_token:
      input: 1.25
      output: 4.25
      cache:
        read: 0.15
    alternative_keys:
      - meta/muse_spark_1_3_minimal:
          label: Muse Spark 1.3 (Minimal)
          default_parameters:
            reasoning_effort: "minimal"
      - meta/muse_spark_1_3_low:
          label: Muse Spark 1.3 (Low)
          default_parameters:
            reasoning_effort: "low"
      - meta/muse_spark_1_3_medium:
          label: Muse Spark 1.3 (Medium)
          default_parameters:
            reasoning_effort: "medium"
      - meta/muse_spark_1_3_high:
          label: Muse Spark 1.3 (High)
          default_parameters:
            reasoning_effort: "high"
      - meta/muse_spark_1_3_xhigh:
          label: Muse Spark 1.3 (Extra High)
          default_parameters:
            reasoning_effort: "xhigh"

  meta/muse_spark_1_3_max:
    label: Muse Spark 1.3 Max
    provider_endpoint: muse-spark-1.3
    supports:
      videos: true
    provider_properties:
      use_responses: true
      prompt_cache_key: hash
    release_date: 2026-09-05
    default_parameters:
      reasoning_effort: "max"
      temperature: 1
    properties:
      context_window: 1_048_576
      max_tokens: 131_072
      reasoning_model: true
    costs_per_million_token:
      input: 1.25
      output: 4.25
      cache:
        read: 0.15
transcription-models:
  base-config:
    rate_limit:
      supports_live_monitoring: false
    documentation_url: "https://developer.meta.com/ai/models/\
      muse-voice-transcribe/"
    metadata:
      available_for_everyone: true
      internal_only: false
    supports:
      transcription: true
      images: false
      files: false
      temperature: false
      tools: false
    costs_per_million_token: null
    transcription_streaming: true
    transcription_language:
      format: iso-639-1
      default: en

  meta/muse_voice_transcribe:
    label: Muse Voice Transcribe
    provider_endpoint: muse-voice-transcribe-1.0
    release_date: 2026-08-30
    transcription_cost:
      usd_per_minute: 0.003
      billing_basis: audio
