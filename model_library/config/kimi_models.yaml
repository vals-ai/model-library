base-config:
  rate_limit:
    supports_live_monitoring: true
  company: Moonshot AI
  country: China
  documentation_url: https://platform.moonshot.ai/docs
  open_source: true
  supports:
    images: false
    tools: true
    files: false

kimi-models:

  kimi/kimi-k3:

    label: Kimi K3
    release_date: 2026-07-16
    documentation_url: https://platform.kimi.ai/docs/api/chat
    provider_endpoint: kimi-k3
    supports:
      images: true
      videos: true
      temperature: false
    properties:
      reasoning_model: true
      context_window: 1_048_576
      max_tokens: 1_048_576
    default_parameters:
      reasoning_effort: max
      max_tokens: 262_144
    provider_properties:
      prompt_cache_key: hash
    costs_per_million_token:
      input: 3.0
      output: 15.0
      cache:
        read: 0.3
    alternative_keys:
      - kimi/kimi-k3-public
  kimi/kimi-k2.7-code:
    label: Kimi K2.7 Code
    release_date: 2026-06-12
    documentation_url: https://platform.kimi.ai/docs/guide/kimi-k2-7-code-quickstart
    supports:
      images: true
      videos: true
      temperature: false
    properties:
      reasoning_model: true
      context_window: 262_144
      max_tokens: 256_000
    default_parameters:
      max_tokens: 32_768
      temperature: 1.0
      top_p: 0.95
    costs_per_million_token:
      input: 0.95
      output: 4.0
      cache:
        read: 0.19

  kimi/kimi-k2.6:
    label: Kimi K2.6
    release_date: 2026-04-20
    supports:
      images: true
      videos: true
      temperature: false
    properties:
      reasoning_model: false
      context_window: 262_144
      max_tokens: 256_000
    default_parameters:
      temperature: 0.6
      top_p: 0.95
      max_tokens: 128_000
    costs_per_million_token:
      input: 0.95
      output: 4.0
      cache:
        read: 0.16
    alternative_keys:
      - kimi/kimi-k2.6-thinking:
          properties:
            reasoning_model: true
          default_parameters:
            temperature: 1.0
