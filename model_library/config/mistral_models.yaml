base-config:
  rate_limit:
    supports_live_monitoring: true
  company: Mistral
  country: France
  documentation_url: "https://docs.mistral.ai/getting-started/models/\
    models_overview/"
  open_source: false
  supports:
    images: false
    files: false
    tools: true
  properties:
    context_window: null
    max_tokens: null
    training_cutoff: null
    reasoning_model: false
  costs_per_million_token:
    cache:
      read_discount: 0.1

# Standard Mistral Models
mistral-models:
  base-config:
    supports:
      temperature: true
    default_parameters:
      temperature: 0.7

  mistralai/mistral-small-2603:
    label: Mistral Small 4
    open_source: true
    release_date: 2026-03-16
    documentation_url: https://docs.mistral.ai/models/mistral-small-4-0-26-03
    supports:
      images: true
    properties:
      context_window: 262_144
      max_tokens: 256_000
      reasoning_model: true
    costs_per_million_token:
      input: 0.15
      output: 0.6
    default_parameters:
      reasoning_effort: "high"
  mistralai/mistral-large-2512:
    label: Mistral Large 3
    open_source: true
    release_date: 2025-12-02
    supports:
      images: true
    properties:
      context_window: 262_144
      max_tokens: 256_000
    costs_per_million_token:
      input: 0.5
      output: 1.5
    default_parameters:
      temperature: 0.065
  mistralai/mistral-medium-3.5:
    label: Mistral Medium 3.5
    open_source: true
    release_date: 2026-04-29
    documentation_url: "https://docs.mistral.ai/models/model-cards/\
      mistral-medium-3-5-26-04"
    supports:
      images: true
    properties:
      context_window: 262_144
      max_tokens: 80_000
      reasoning_model: true
    costs_per_million_token:
      input: 1.5
      output: 7.5
    default_parameters:
      temperature: 0.7
      top_p: 0.95
      reasoning_effort: "high"
transcription-models:
  base-config:
    rate_limit:
      supports_live_monitoring: false
    properties: null
    release_date: 2026-02-04
    supports:
      transcription: true
      temperature: false
      tools: false
    costs_per_million_token: null
    transcription_language:
      format: iso-639-1
      default: en

  mistral/voxtral-mini-transcribe-realtime-2602:
    label: Voxtral Mini Transcribe Realtime 2602
    transcription_streaming: true
    documentation_url: "https://docs.mistral.ai/studio-api/audio/\
      speech_to_text/realtime_transcription"
    transcription_cost:
      usd_per_minute: 0.006
      billing_basis: audio

  mistral/voxtral-mini-2602:
    label: Voxtral Mini Transcribe 2
    transcription_streaming: false
    documentation_url: "https://docs.mistral.ai/studio-api/audio/\
      speech_to_text/offline_transcription"
    transcription_cost:
      usd_per_minute: 0.003
      billing_basis: audio
