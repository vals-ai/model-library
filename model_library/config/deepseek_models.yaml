base-config:
  company: DeepSeek
  country: China
  documentation_url: https://api-docs.deepseek.com/
  open_source: true
  supports:
    images: false
    files: false
    tools: true
    temperature: true
  properties:
    reasoning_model: false
  default_parameters:
    temperature: 1

v4-models:
