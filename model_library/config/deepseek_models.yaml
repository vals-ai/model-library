          sat-sun: [[0, 24]]

  deepseek/deepseek-v4-pro:
    label: DeepSeek V4
    release_date: 2026-04-23
    properties:
      context_window: 1_000_000
      max_tokens: 384_000
      reasoning_model: true
    default_parameters:
      reasoning_effort: "max"
      max_tokens: 384_000
    costs_per_million_token:
      input: 1.32
      output: 3.96
      cache:
        read: 0.044
    alternative_keys:
      - deepseek/deepseek-v4-pro-medium:
